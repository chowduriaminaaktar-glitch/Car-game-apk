name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  release:
    types: [ published, created ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach APK to (optional, defaults to latest release if available)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Study-AI.apk
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk Study-AI.apk
            ls -lh Study-AI.apk
          else
            echo "Error: app-debug.apk was not found!" >&2
            exit 1
          fi

      - name: Upload Study-AI.apk as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-AI.apk
          path: Study-AI.apk
          retention-days: 30

      - name: Attach Study-AI.apk to GitHub Release (Release Event)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Study-AI.apk
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Study-AI.apk to Release (Manual Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TARGET_TAG="${{ inputs.tag_name }}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          fi
          if [ -n "$TARGET_TAG" ]; then
            echo "Attaching Study-AI.apk to release: $TARGET_TAG"
            gh release upload "$TARGET_TAG" Study-AI.apk --clobber
          else
            echo "No existing release found to attach to. APK is saved as a workflow artifact."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
